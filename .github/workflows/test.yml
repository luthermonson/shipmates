name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The Beads integration parses the external bd CLI's stdout, so it is verified
  # against the real binary rather than a stand-in. Pin the release and its
  # digest; bd's output *is* the contract internal/beads depends on. Bump these
  # three together: BD_VERSION/BD_SHA256_* here, the Version constant in
  # internal/beads/bdtest, and the Beads section of docs/sailing.md.
  BD_VERSION: 1.1.2
  BD_SHA256_LINUX_AMD64: a72d71ed374955dc9f83a0f90b54bd7b6a0016709dd1676ae2e368651ed401c2
  BD_SHA256_WINDOWS_AMD64: 4591b07bf82b3203a1dc7db17a7e4962d86338e6c3d34a8a857cc11a57f9c159
  # Turns a missing bd into a failing test instead of a silent skip. Without
  # this, a broken install step would quietly delete the only coverage of the
  # external contract and CI would still be green.
  SHIPMATES_TEST_BD_REQUIRED: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod pins the exact toolchain (1.26.x); setup-go resolves it.
          go-version-file: go.mod

      - name: Install bd (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bd.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          echo "${BD_SHA256_LINUX_AMD64}  /tmp/bd.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/bd.tar.gz -C "$HOME/.local/bin" bd
          rm -f /tmp/bd.tar.gz
          chmod +x "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bd" version | tee /tmp/bd-version
          grep -q "bd version ${BD_VERSION} " /tmp/bd-version

      # pwsh, not bash: `unzip` is not guaranteed on the Windows image, while
      # Expand-Archive and Get-FileHash always are.
      - name: Install bd (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'bd.zip'
          Invoke-WebRequest "https://github.com/gastownhall/beads/releases/download/v$env:BD_VERSION/beads_${env:BD_VERSION}_windows_amd64.zip" -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne $env:BD_SHA256_WINDOWS_AMD64) { throw "bd archive digest is $digest, expected $env:BD_SHA256_WINDOWS_AMD64" }
          $unpacked = Join-Path $env:RUNNER_TEMP 'bd'
          Expand-Archive $archive -DestinationPath $unpacked -Force
          $bin = Join-Path $HOME 'bd-bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Move-Item (Join-Path $unpacked 'bd.exe') (Join-Path $bin 'bd.exe') -Force
          Remove-Item $archive -Force
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& (Join-Path $bin 'bd.exe') version) -join "`n"
          Write-Host $version
          if ($version -notmatch ("bd version " + [regex]::Escape($env:BD_VERSION) + " ")) { throw "unexpected bd version: $version" }

      - name: Build
        run: go build ./...

      - name: Vet (ubuntu)
        if: runner.os == 'Linux'
        run: go vet ./...

      # Vet compiles test files too, so on Windows it must skip the same
      # packages the Windows test step skips (their test files are not
      # build-tag gated for unix-only code) — see the Test (windows)
      # comment below for the rationale per package.
      - name: Vet (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go vet $(go list ./... | grep -v -E 'internal/(delegation|fleetcommandermailbox|fleetconfig|fleetidentity|fleetinterrupt|installer|recovery|voyage)$')

      # The fleetconfig, m3provision, and m3runtime test suites are
      # environment-dependent: they exercise the M3 authority/qualifier
      # deployment posture (pinned trust roots, delegated cgroup slices, a
      # running M3 authority daemon) that a stock GitHub runner does not
      # provide, and they fail closed by design ("fleet config
      # unavailable") rather than skipping. Until those suites grow a
      # detect-and-skip preflight for non-provisioned hosts, exclude the
      # three packages from CI on Linux. Everything else runs with -race.
      - name: Test (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -race -count=1 -timeout=10m $(go list ./... | grep -v -E 'internal/(fleetconfig|m3provision|m3runtime)$')

      # Windows runs the cross-platform product surface (commands, the
      # runtime interface + both adapters, containment, catalog, policy,
      # project tooling that is portable, …) with -race. Excluded packages
      # fall into two pre-existing buckets, neither introduced by the
      # runtime-interface work:
      #   1. unix-only subsystems whose *test* files are not build-tag
      #      gated, so `go test` fails to compile them on Windows:
      #      delegation, fleetcommandermailbox, fleetconfig, installer.
      #      dashboard came off this list once the interactive terminal
      #      was ported to golang.org/x/term: it is now built and tested
      #      on Windows like any other portable package.
      #   2. suites that still assume unix permission/fsync semantics in
      #      their own durable stores: fleetidentity, fleetinterrupt,
      #      recovery, voyage. Each keeps a private copy of the
      #      `mode&0o077` check and the rename-then-fsync-the-directory
      #      pattern, neither of which can succeed on Windows.
      #      client, codexapp, livesession, project, and server came off
      #      this list: the coordination server now runs on Windows, its
      #      durable stores verify a real DACL instead of mode bits, and
      #      renames commit through MOVEFILE_WRITE_THROUGH instead of a
      #      directory flush Windows refuses.
      # Shrinking what remains is tracked in docs/platform-support.md
      # ("Where to next").
      - name: Test (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go test -race -count=1 -timeout=10m $(go list ./... | grep -v -E 'internal/(delegation|fleetcommandermailbox|fleetconfig|fleetidentity|fleetinterrupt|installer|recovery|voyage)$')
