name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # The release body is the hand-written notes at
          # docs/releases/<tag>.md, not goreleaser's generated changelog.
          # goreleaser computes "commits since the previous tag", and this
          # repo's main line was rebuilt at some point so the v0.2–v0.4 tags
          # are not ancestors of main — the generated changelog would reach
          # back to v0.1.3 and list hundreds of commits. Each release adds its
          # own docs/releases/<tag>.md; the tag push fails loudly here if the
          # file is missing, which is the reminder to write the notes.
          args: release --clean --release-notes=docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
