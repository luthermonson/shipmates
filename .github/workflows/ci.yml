name: ci

# Runs on pull requests and on pushes to main, on the ephemerd self-hosted
# fleet.
#
# The `feat/**` glob on pull_request is deliberate, a lesson from a prior
# project where its absence cost real work: a PR targeting a long-lived
# feature branch gets NO checks at all without it, and a 1700-line change
# landed with nothing having so much as type-checked it. Shipmates stacks
# work the same way, so stacked PRs need the same gate as main.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, "feat/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"

# A new push to a PR makes the previous run's answer irrelevant — and on a small
# fleet a superseded run is also a runner somebody else is queued behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    # The Go toolchain arrives with the job image rather than being installed
    # per run. ephemerd intercepts `container:` on every platform — on Linux it
    # is an ordinary container, on Windows and macOS it extracts the image's
    # layers onto the VM's disk — so this is not limited to the Linux legs the
    # way GitHub's own runner would limit it.
    #
    # This is what retires the windows-x64 failure. actions/setup-go downloaded
    # Go in ~6s and then spent 8+ minutes in "Extracting Go...": the toolchain
    # is ~15k small files, and every write under _work crosses a VSMB share
    # into the Hyper-V utility VM. Anything already in an image layer skips
    # that cost entirely.
    #
    # Keep the tag's patch version in lockstep with go.mod. The Linux images
    # set GOTOOLCHAIN=local, so a go.mod bump past the image is a loud failure
    # rather than a silent per-job download.
    container: ${{ matrix.container }}
    # A hung test must not pin a runner in a small fleet. The suite is a couple
    # of minutes; 20 is generous and still bounded.
    timeout-minutes: 20
    strategy:
      # Do not cancel the others when one fails: which platform failed is the
      # most useful thing this matrix reports, and fail-fast throws that away.
      # Concretely — the berth symlink bug failed on Windows and macOS only and
      # passed everywhere else, including on both developer machines.
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            container: golang:1.26.6-bookworm
          - os: linux
            arch: arm64
            # Same tag on both arches: library/golang is a real multi-arch
            # manifest, so the arm64 runner pulls arm64v8 natively.
            container: golang:1.26.6-bookworm
          - os: macos
            arch: arm64
            # No upstream Go image for macOS — Apple's platform isn't
            # containerized — so this leg keeps installing the toolchain.
            container: ""
          - os: windows
            arch: x64
            container: golang:1.26.6-windowsservercore-ltsc2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        # Only the legs with no image to supply Go. Note setup-go would NOT
        # short-circuit on the image's toolchain even where one exists: it
        # never inspects PATH, it probes RUNNER_TOOL_CACHE and installs on a
        # miss. So this has to be skipped, not merely expected to no-op.
        if: matrix.container == ''
        timeout-minutes: 8
        with:
          # Single source of truth: the version in go.mod, not a literal here
          # that silently drifts from it.
          go-version-file: go.mod
          # The fleet's runners are ephemeral, so this is their only cache.
          cache: true

      - name: Trust the workspace
        # Inside the job image the build runs as root over a checkout owned by
        # the runner's uid, so git refuses it as "dubious ownership" and
        # `go build` fails at the VCS stamp with `error obtaining VCS status:
        # exit status 128` — before compiling anything. Cheaper than dropping
        # the stamp with -buildvcs=false, which would silently strip the commit
        # from every binary this job produces.
        #
        # "*" rather than the workspace path: github.workspace is the HOST path
        # (/home/runner/_work/...), while inside the image the checkout is
        # mounted at /__w/..., so naming it marks a directory that does not
        # exist here. actions/checkout does mark the right path, but only in
        # the temporary global config it scopes to its own step, so later steps
        # are back to untrusted.
        if: matrix.container != ''
        run: git config --global --add safe.directory "*"

      - name: Toolchain
        # Records which Go actually ran, so a mismatch between the image tag
        # and go.mod is visible in the log rather than inferred from a failure.
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run always means the
      # tests actually executed on this runner.
      - name: Test
        run: go test -count=1 ./...

  # Race detection on one platform: it is slow, and one platform catches the
  # overwhelming majority of data races in portable Go. It has already earned
  # its place — it found the remotedialer startPings/stopPings race that no
  # amount of reading had.
  race:
    name: race (linux-x64)
    runs-on: [self-hosted, linux, x64]
    # -race requires cgo, which requires a C compiler. golang:*-bookworm is
    # built on buildpack-deps and ships gcc, g++, libc6-dev and make, which is
    # what let the old "Ensure a C toolchain" step go away: it apt-got
    # build-essential at run time and had to negotiate whether the runner came
    # up as root, as a sudo user, or as neither — a whole class of failure
    # unrelated to the change under test.
    container: golang:1.26.6-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace
        # See the note on the same step in `test`: root-in-image over a
        # runner-owned checkout trips git's dubious-ownership guard.
        run: git config --global --add safe.directory "*"

      - name: Toolchain
        run: |
          go version
          cc --version | head -1

      - name: Test with race detector
        run: go test -race -count=1 ./...
