# Captain policy overlay
#
# Vendored to .shipmates/policies/captain.yaml on `shipmates add captain`.
# Shipmates policy rules are evaluated by the Codex-native runtime. Rules here
# extend (allow/ask) or union (deny) with the project-level rules; deny in
# ANY layer beats everything.
#
# Edit in .shipmates/policies/captain.yaml (in your project) to customize —
# shipmates-update won't clobber operator edits.
allow:
  - Bash(gh pr view *)
  - Bash(gh pr list *)
  - Bash(gh issue view *)
  - Bash(gh issue list *)
  - Bash(git status)
  - Bash(git diff *)
  - Bash(git log *)
ask:
  - Bash(gh pr merge *)
  - Bash(gh pr close *)
  - Bash(git push *)
deny:
  - Bash(rm -rf /)
  - Bash(rm -rf ~)
  - Bash(sudo *)
  - Bash(curl * | sh)
  - Bash(curl * | bash)
