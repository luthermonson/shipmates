<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shipmates fleet — login</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem 1.75rem;
    width: min(380px, 90vw);
  }
  .card h1 { margin: 0 0 1rem; font-size: 1.05rem; }
  .card p { color: var(--muted); margin: 0 0 1rem; font-size: 0.85rem; }
  .card form { display: flex; flex-direction: column; gap: 0.6rem; }
  .card input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.65rem;
    font-family: var(--mono);
    font-size: 0.9rem;
  }
  .card button {
    background: var(--accent);
    color: var(--bg);
    border: 0;
    border-radius: 4px;
    padding: 0.55rem 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .err {
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--bad);
    color: var(--bad);
    border-radius: 4px;
    padding: 0.4rem 0.6rem;
    font-size: 0.8rem;
    margin-bottom: 0.75rem;
    font-family: var(--mono);
  }
</style>
</head>
<body>
<div class="card">
  <h1>shipmates fleet</h1>
  <p>Enter the fleet token to continue. The same secret your captains use.</p>
  <!--ERR-->
  <form method="POST" action="/login">
    <input type="password" name="token" placeholder="fleet token" autofocus required>
    <button type="submit">sign in</button>
  </form>
</div>
</body>
</html>
