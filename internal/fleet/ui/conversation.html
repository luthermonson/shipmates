<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shipmates fleet — conversation</title>
<link rel="stylesheet" href="/style.css?v=48">
<style>
  main { flex-direction: column; }
  #convo {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .bubble {
    max-width: 80%;
    padding: 0.55rem 0.8rem;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user      { align-self: flex-end; background: var(--accent); color: var(--bg); }
  .bubble.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .bubble.tool      { align-self: flex-start; background: rgba(63,185,80,0.10); border: 1px dashed var(--good); color: var(--muted); font-family: var(--mono); font-size: 0.78rem; }
  .bubble.thinking  { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-style: italic; }
  .controls {
    display: flex;
    justify-content: center; /* voice-first: one mic, front and center */
    align-items: center;
    padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #mic {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    border: 0;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* conversation ON, waiting for speech: green with a slow breathe */
  #mic.live { background: var(--good, #3fb950); animation: breathe 2.4s infinite; }
  /* actively capturing an utterance: red with the fast pulse */
  #mic.recording, #mic.live.recording { background: var(--bad); animation: pulse 1s infinite; }
  #mic:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes breathe { 50% { transform: scale(1.03); opacity: 0.85; } }
  .hint { color: var(--muted); font-size: 0.75rem; padding: 0 1rem 0.5rem; text-align: center; }
  /* header: keep the title and nav chips on one line, no ugly wraps */
  header { gap: 0.6rem; }
  header h1 { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  header .right .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem 0.8rem;
    font-size: 0.78rem;
    text-decoration: none;
    cursor: pointer;
  }
  header .right .chip:hover { color: var(--text); border-color: var(--accent); }
  #mic svg { display: block; }
</style>
</head>
<body>
<header>
  <h1>conversation</h1>
  <div class="right">
    <a href="/" class="chip">⌂ dashboard</a>
    <form id="logout-form" method="POST" action="/logout" style="display:contents"><button type="submit" class="chip">sign out</button></form>
  </div>
</header>
<main>
  <div id="convo"></div>
  <div class="hint" id="hint">tap the mic and just talk — replies are spoken aloud.
    <button id="tts-test" style="margin-left:0.5rem;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem 0.5rem;font-size:0.75rem;cursor:pointer;">🔊 test voice</button>
    <span id="tts-info" style="color:var(--muted);margin-left:0.5rem;font-size:0.7rem;"></span>
  </div>
  <div class="controls">
    <button id="mic" title="start / end the conversation" aria-label="start or end the conversation">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
      </svg>
    </button>
  </div>
</main>
<script src="/conversation.js?v=48"></script>
</body>
</html>
